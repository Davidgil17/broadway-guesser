<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Broadway Guesser</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="app">
    <header>
      <div id="header-row">
        <div class="hdr-side hdr-left"><a id="archive-link" href="/archive">Archive</a><button id="theme-btn" aria-label="Choose theme">Theme</button></div>
        <h1>Broadway Guesser</h1>
        <div class="hdr-side hdr-right"><button id="stats-btn" aria-label="View statistics">Stats</button></div>
      </div>
      <p id="date-display"></p>
      <div id="archive-banner" style="display:none">
        <button id="back-to-today">← Back to Today</button>
      </div>
      <div id="score-stars"></div>
    </header>

    <main>
      <div id="no-show-message" style="display:none">
        <p>No show scheduled for today. Check back tomorrow!</p>
      </div>

      <div id="game-area">
        <div id="clues-container"></div>

        <div id="feedback-message"></div>

        <div id="input-section">
          <div id="guess-row">
            <div id="autocomplete-wrapper">
              <input
                id="guess-input"
                type="text"
                placeholder="Type a Broadway show..."
                autocomplete="off"
                aria-label="Guess a Broadway show"
              >
              <div id="autocomplete-dropdown"></div>
            </div>
            <button id="submit-btn">Guess</button>
          </div>
          <p id="guesses-remaining"></p>
        </div>

        <div id="end-section" style="display:none">
          <p id="end-message"></p>
          <div id="end-buttons">
            <button id="share-btn">Share</button>
            <a id="leaderboard-btn" href="/leaderboard">Leaderboard</a>
          </div>
          <p id="share-confirm" style="display:none">Copied to clipboard!</p>
          <div id="countdown-timer"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- Name prompt modal -->
  <div id="name-modal" style="display:none" role="dialog" aria-modal="true" aria-label="Join Leaderboard">
    <div id="name-overlay"></div>
    <div id="name-content">
      <h2>Join the Leaderboard</h2>
      <p>Pick a name to save your scores — your past games count too.</p>
      <input id="name-input" type="text" placeholder="Your name" maxlength="30" autocomplete="off">
      <p id="name-error" style="display:none"></p>
      <div class="name-buttons">
        <button id="name-submit">Join</button>
        <button id="name-skip">Skip</button>
      </div>
    </div>
  </div>

  <!-- Stats modal -->
  <div id="stats-modal" style="display:none" role="dialog" aria-modal="true" aria-label="Statistics">
    <div id="stats-overlay"></div>
    <div id="stats-content">
      <button id="stats-close" aria-label="Close">&times;</button>
      <h2>Statistics</h2>
      <div id="stats-grid">
        <div class="stat-box"><span id="stat-played">0</span><label>Played</label></div>
        <div class="stat-box"><span id="stat-winpct">0</span><label>Win %</label></div>
        <div class="stat-box"><span id="stat-streak">0</span><label>Streak</label></div>
        <div class="stat-box"><span id="stat-maxstreak">0</span><label>Best</label></div>
      </div>
      <h3>Guess Distribution</h3>
      <div id="stats-distribution"></div>
    </div>
  </div>

  <!-- Theme picker modal -->
  <div id="theme-modal" style="display:none" role="dialog" aria-modal="true" aria-label="Choose Theme">
    <div id="theme-overlay"></div>
    <div id="theme-content">
      <button id="theme-close" aria-label="Close">&times;</button>
      <h2>Theme</h2>
      <div id="theme-grid">
        <button class="theme-swatch" data-theme="classic">
          <span class="swatch-preview" style="background:linear-gradient(90deg,#2a1500 80%,#c9a84c 80%)"></span>
          Classic
        </button>
        <button class="theme-swatch" data-theme="playbill">
          <span class="swatch-preview" style="background:linear-gradient(90deg,#fffcf7 80%,#8b1a1a 80%)"></span>
          Playbill
        </button>
        <button class="theme-swatch" data-theme="neon">
          <span class="swatch-preview" style="background:linear-gradient(90deg,#150020 80%,#ff2d92 80%)"></span>
          Neon
        </button>
        <button class="theme-swatch" data-theme="encore">
          <span class="swatch-preview" style="background:linear-gradient(90deg,#081828 80%,#4ecdc4 80%)"></span>
          Encore
        </button>
      </div>
    </div>
  </div>

  <script src="/static/game.js?v=6"></script>
</body>
</html>
