<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Broadway Guesser — Archive</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    #archive-header { margin-bottom: 2rem; }

    #archive-header h2 {
      font-size: clamp(1rem, 4vw, 1.3rem);
      color: var(--text-muted);
      font-weight: normal;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-top: 0.5rem;
    }

    #month-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      margin-bottom: 1.5rem;
    }

    #month-label {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text);
      min-width: 12rem;
      text-align: center;
    }

    .nav-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: var(--radius);
      width: 2.25rem;
      height: 2.25rem;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.15s, color 0.15s;
      flex-shrink: 0;
    }

    .nav-btn:hover:not(:disabled) { border-color: var(--gold); color: var(--gold); }
    .nav-btn:disabled { opacity: 0.3; cursor: default; }

    #calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
      margin-bottom: 2rem;
    }

    .cal-header {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      text-align: center;
      padding-bottom: 0.5rem;
    }

    .cal-cell {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius);
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 0.9rem;
      position: relative;
      color: var(--text-muted);
    }

    .cal-cell.empty { background: none; }

    .cal-cell.no-show { color: var(--border); }

    .cal-cell.has-show {
      border: 1px solid var(--gold-dark);
      color: var(--text);
      cursor: pointer;
    }

    .cal-cell.has-show:hover { border-color: var(--gold); color: var(--gold); }

    .cal-cell.today {
      outline: 2px solid var(--gold);
      outline-offset: -2px;
    }

    .cal-cell.played-won {
      background: var(--gold-dark);
      color: var(--bg);
      border: none;
      cursor: pointer;
      font-weight: 700;
    }

    .cal-cell.played-won:hover { background: var(--gold); }

    .cal-cell.played-lost {
      background: var(--border);
      color: var(--text-muted);
      border: none;
      cursor: pointer;
    }

    .cal-cell.played-lost:hover { background: #5a3e00; color: var(--text); }

    .cal-cell.in-progress {
      border: 1px solid var(--gold-dark);
      color: var(--text);
      cursor: pointer;
    }

    .cal-cell.in-progress::after {
      content: '';
      position: absolute;
      bottom: 3px;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 4px;
      background: var(--gold);
      border-radius: 50%;
    }

    #legend {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .legend-swatch {
      width: 1rem;
      height: 1rem;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .swatch-won { background: var(--gold-dark); }
    .swatch-lost { background: var(--border); }
    .swatch-unplayed { border: 1px solid var(--gold-dark); background: transparent; }
    .swatch-today { outline: 2px solid var(--gold); outline-offset: -2px; border-radius: 4px; background: transparent; }
  </style>
</head>
<body>
  <div id="app">
    <header id="archive-header">
      <div id="header-row">
        <div class="hdr-side hdr-left"><a id="archive-link" href="/">← Today</a></div>
        <h1>Broadway Guesser</h1>
        <div class="hdr-side hdr-right"></div>
      </div>
      <h2>Archive</h2>
    </header>

    <main>
      <div id="month-nav">
        <button class="nav-btn" id="prev-month" aria-label="Previous month">&#8592;</button>
        <span id="month-label"></span>
        <button class="nav-btn" id="next-month" aria-label="Next month">&#8594;</button>
      </div>

      <div id="calendar-grid"></div>

      <div id="legend">
        <div class="legend-item"><div class="legend-swatch swatch-won"></div> Won</div>
        <div class="legend-item"><div class="legend-swatch swatch-lost"></div> Lost</div>
        <div class="legend-item"><div class="legend-swatch swatch-unplayed"></div> Not played</div>
        <div class="legend-item"><div class="legend-swatch swatch-today"></div> Today</div>
      </div>
    </main>
  </div>

  <script src="/static/archive.js"></script>
</body>
</html>
